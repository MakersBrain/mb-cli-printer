name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Created from the selected ref if missing."
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      force:
        description: "Force: overwrite an existing release/tag and skip the test gate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.force != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q

  release:
    needs: test
    # `always()` lets the release run when the test gate was skipped by force.
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "tag ${tag} already exists"
            else
              git tag "${tag}"
              git push origin "${tag}"
            fi
            if [ "${FORCE}" = "true" ] && gh release view "${tag}" >/dev/null 2>&1; then
              echo "deleting the existing release for ${tag}"
              gh release delete "${tag}" --yes
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the project version
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          tag="${{ steps.tag.outputs.tag }}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::warning::tag ${tag} does not match pyproject version ${version}"
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" dist/* \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            ${{ inputs.prerelease == true && '--prerelease' || '' }}
