[project]
name = "mbprint-fonts-compatible"
version = "0.1.0"
description = "Free substitutes for common proprietary fonts in mb-cli-printer"
requires-python = ">=3.10"
license = "OFL-1.1"

[project.entry-points."mbprint.font_bundles"]
compatible = "mbprint_fonts_compatible:font_directory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbprint_fonts_compatible"]

[tool.hatch.build.targets.sdist]
include = ["src/mbprint_fonts_compatible", "README.md", "SOURCES.md"]
