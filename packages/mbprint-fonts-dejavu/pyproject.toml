[project]
name = "mbprint-fonts-dejavu"
version = "0.1.0"
description = "Optional DejaVu font bundle for mb-cli-printer"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.entry-points."mbprint.font_bundles"]
dejavu = "mbprint_fonts_dejavu:font_directory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbprint_fonts_dejavu"]

[tool.hatch.build.targets.sdist]
include = ["src/mbprint_fonts_dejavu", "README.md", "LICENSE"]
