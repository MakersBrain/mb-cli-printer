[project]
name = "mb-cli-printer"
version = "0.1.0"
description = "Phomemo label printer driver + label.json layout renderer (print, preview, PDF)"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "qrcode>=7.4",
    "bleak>=0.22",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Colored logging and a live progress bar. Install with: uv sync --extra tui
tui = ["rich>=13.7"]
usb = ["pyusb>=1.2"]
barcode = ["python-barcode>=0.15"]

[project.scripts]
mbprint = "mbprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mbprint"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Reference implementation of the Brother QL raster language. The test
    # suite diffs our byte stream against it; skipped when absent.
    "brother-ql",
    "packbits",
]
